name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - dev

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          submodules: recursive
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ghp-import
      
      - name: Build and deploy site
        run: |
          # Configure git for ghp-import commit on master
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Build the site with production config
          pelican content -s publishconf.py

          # Import to master branch and push. master only contains generated output
          # for the current dev commit, so force-pushing it is expected.
          ghp-import -m "Generate Pelican site" -b master output
          git push --force origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
